version: '3.8'
services:
    agent1:
      image: jenkins/ssh-agent:alpine-jdk17
      privileged: true
      user: root
      environment:
        JENKINS_AGENT_SSH_PUBKEY: ssh-rsa  root@ef44899fa698
      ports:
        - "4444:22"
      container_name: jenkins_agent1

    agent2:
      image: javacream/jenkins_ssh_agent:1.0
      privileged: true
      user: root
      environment:
        JENKINS_AGENT_SSH_PUBKEY: ssh-rsa  root@ef44899fa698
      ports:
        - "4445:22"
      container_name: jenkins_agent2
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

